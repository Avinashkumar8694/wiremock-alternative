<mat-card>
    <mat-card-header>
      <mat-card-title>Login (Mock API)</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field>
          <input matInput placeholder="Username" [(ngModel)]="username" name="username" required>
        </mat-form-field>
        <mat-form-field>
          <input matInput type="password" placeholder="Password" [(ngModel)]="password" name="password" required>
        </mat-form-field>
        <!-- <mat-form-field>
          <input matInput placeholder="Organization" [(ngModel)]="organization" name="organization" required>
        </mat-form-field> -->
        <div fxFlayout="row" fxLayoutAlign="center center">

            <button mat-raised-button color="primary" type="submit">Login</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
